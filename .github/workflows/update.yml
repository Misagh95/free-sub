name: Auto Update Sub

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: auto-update-sub
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch & merge
        run: |
          touch /tmp/all.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            curl -sL -A "v2rayNG/1.9.16" "$url" -o /tmp/src.txt
                      grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' /tmp/all.txt | sort -u > /tmp/raw_configs.txt

          python3 - <<'PY'
          import json
          import re
          import socket
          import urllib.parse
          import urllib.request
          from pathlib import Path

          protocols = r"^(vless|vmess|trojan|ss|hysteria2|tuic)://"
          cache_file = Path("/tmp/geo-cache.json")

          try:
              geo_cache = json.loads(cache_file.read_text())
          except Exception:
              geo_cache = {}

          def flag(country_code):
              country_code = (country_code or "").upper()
              if len(country_code) != 2 or not country_code.isalpha():
                  return "🌐"
              return "".join(chr(127397 + ord(c)) for c in country_code)

          def get_host(line):
              # حذف fragment قبلی
              without_fragment = line.split("#", 1)[0]

              try:
                  parsed = urllib.parse.urlsplit(without_fragment)
                  host = parsed.hostname
                  if host:
                      return host.strip("[]")
              except Exception:
                  pass

              return None

          def get_ip(host):
              if not host:
                  return None

              # اگر خودش IP است
              if re.match(r"^[0-9]+(?:\.[0-9]+){3}$", host):
                  return host

              try:
                  return socket.gethostbyname(host)
              except Exception:
                  return None

          def get_country(ip):
              if not ip:
                  return "🌐"

              if ip in geo_cache:
                  return geo_cache[ip]

              try:
                  req = urllib.request.Request(
                      f"https://ipwho.is/{urllib.parse.quote(ip)}",
                      headers={"User-Agent": "DGDreams-Config-Updater/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=8) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  country_code = data.get("country_code", "")
                  result = flag(country_code)
              except Exception:
                  result = "🌐"

              geo_cache[ip] = result
              return result

          def rename_config(line):
              line = line.strip()
              if not re.match(protocols, line):
                  return None

              # fragment قبلی را حذف می‌کنیم
              base = line.split("#", 1)[0]
              host = get_host(base)
              ip = get_ip(host)
              country_flag = get_country(ip)

              # فاصله و پرچم را برای URI به‌صورت امن encode می‌کنیم
              new_name = urllib.parse.quote(f"DGDreams {country_flag}", safe="")
              return f"{base}#{new_name}"

          output = set()

          for raw_line in Path("/tmp/raw_configs.txt").read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():
              result = rename_config(raw_line)
              if result:
                  output.add(result)

          configs = sorted(output)

          Path("configs.txt").write_text(
              "\n".join(configs) + ("\n" if configs else ""),
              encoding="utf-8"
          )

          cache_file.write_text(
              json.dumps(geo_cache, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          base64 -w0 configs.txt > configs_base64.txt

          done < sources.txt
          grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' /tmp/all.txt | sort -u > configs.txt
          base64 -w0 configs.txt > configs_base64.txt

      - name: Verify output
        run: |
          echo "count: $(wc -l < configs.txt)"
          head -5 configs.txt

      - name: Compute diff
        id: diff
        run: |
          if git cat-file -e HEAD:configs.txt 2>/dev/null; then
            git show HEAD:configs.txt | grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' | sort -u > /tmp/old.txt
            echo "first_run=no" >> "$GITHUB_OUTPUT"
          else
            touch /tmp/old.txt
            echo "first_run=yes" >> "$GITHUB_OUTPUT"
          fi
          comm -13 /tmp/old.txt configs.txt > /tmp/added.txt
          comm -23 /tmp/old.txt configs.txt > /tmp/removed.txt
          echo "added=$(wc -l < /tmp/added.txt)"     >> "$GITHUB_OUTPUT"
          echo "removed=$(wc -l < /tmp/removed.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.diff.outputs.added != '0' || steps.diff.outputs.removed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.txt configs_base64.txt
          git commit -m "🔄 auto update configs" || true
          for i in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin main; then
              echo "✔ pushed"
              exit 0
            fi
            echo "retry $i ..."
            sleep 10
          done
          echo "push failed after retries"
          exit 1

      - name: Send diff to Telegram
        if: steps.diff.outputs.first_run == 'yes' || steps.diff.outputs.added != '0' || steps.diff.outputs.removed != '0'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse

          token = os.environ["TG_BOT_TOKEN"]; chat = os.environ["TG_CHAT_ID"]
          first_run = "${{ steps.diff.outputs.first_run }}" == "yes"
          added   = open("/tmp/added.txt", encoding="utf-8").read().splitlines()
          removed = open("/tmp/removed.txt", encoding="utf-8").read().splitlines()
          total   = sum(1 for _ in open("configs.txt", encoding="utf-8"))

          if first_run:
              msg = f"✅ ساب با {total} کانفیگ راه‌اندازی شد.\nاز این به بعد فقط تغییرات ارسال می‌شود."
          else:
              msg = f"🔄 آپدیت ساب ({total} کانفیگ):\n\n"
              if added:   msg += f"➕ اضافه شد ({len(added)}):\n" + "\n".join(added) + "\n\n"
              if removed: msg += f"➖ حذف شد ({len(removed)}):\n" + "\n".join(removed)

          for i in range(0, len(msg), 3900):
              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": msg[i:i+3900],
                  "disable_web_page_preview": "true",
              }).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data)
          PYEOF
