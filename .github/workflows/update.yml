name: Auto Update Sub

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: auto-update-sub
  cancel-in-progress: true

permissions:
  contents: write

env:
  SUBSCRIPTION_FILES: >-
    configs.txt configs_base64.txt
    patterniha.txt patterniha_base64.txt
    radikal.txt radikal_base64.txt
    barryfar1.txt barryfar1_base64.txt
    barryfar2.txt barryfar2_base64.txt
    barryfar3.txt barryfar3_base64.txt
  SUBSCRIPTION_TXT_FILES: >-
    configs.txt
    patterniha.txt
    radikal.txt
    barryfar1.txt
    barryfar2.txt
    barryfar3.txt

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Inject subscription token
        shell: bash
        run: |
          set -eu
          SUB_TOKEN="${{ secrets.SUB_TOKEN }}"
          if [ -n "$SUB_TOKEN" ]; then
            # replace __TOKEN__ placeholder in sources.txt with actual token
            sed "s|__TOKEN__|${SUB_TOKEN}|g" sources.txt > /tmp/sources_resolved.txt
          else
            cp sources.txt /tmp/sources_resolved.txt
          fi
          echo "Resolved sources:"
          cat /tmp/sources_resolved.txt

      - name: Fetch configs
        shell: bash
        run: |
          set -eu
          python3 scripts/fetch_configs.py /tmp/sources_resolved.txt /tmp/raw_configs.txt

      - name: Rename configs
        shell: bash
        run: |
          set -eu
          python3 scripts/rename_configs.py /tmp/raw_configs.txt configs.txt configs_base64.txt

      - name: Build external subscriptions
        shell: bash
        run: |
          set -eu
          python3 scripts/build_external_subs.py \
            external_sources.txt \
            . \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main" \
            --manifest /tmp/external_subs.json

      - name: Validate output
        shell: bash
        run: |
          set -eu
          echo "Main subscription:"
          echo "Config count:"
          wc -l < configs.txt
          echo
          echo "First 5 configs:"
          head -5 configs.txt
          echo

          if [ ! -s configs.txt ]; then
            echo "ERROR: configs.txt is empty"
            exit 1
          fi

          # verify every line is a valid config URL
          invalid=$(grep -cvE '^(vless|vmess|trojan|ss|hysteria2|tuic)://' configs.txt || true)
          if [ "$invalid" -gt 0 ]; then
            echo "ERROR: $invalid invalid lines found in configs.txt"
            grep -vE '^(vless|vmess|trojan|ss|hysteria2|tuic)://' configs.txt | head -5
            exit 1
          fi

          echo "✓ All lines are valid config URLs"
          echo

          # external subscriptions (warn only — a source may be temporarily down)
          for f in $SUBSCRIPTION_TXT_FILES; do
            [ "$f" = "configs.txt" ] && continue
            if [ ! -f "$f" ]; then
              echo "⚠ $f missing (first successful fetch will create it)"
              continue
            fi
            invalid=$(grep -cvE '^(vless|vmess|trojan|ss|hysteria2|tuic)://' "$f" || true)
            echo "$f: $(wc -l < "$f" | tr -d ' ') configs"
            if [ "$invalid" -gt 0 ]; then
              echo "  ⚠ $invalid invalid lines"
            fi
          done

      - name: Build multi-repository subscriptions
        shell: bash
        run: |
          set -eu
          python3 scripts/split_repositories.py \
            configs.txt \
            /tmp/repositories \
            --owner "${{ github.repository_owner }}" \
            --prefix "free-sub" \
            --max-configs-per-repository 500

      - name: Compute diff
        id: diff
        shell: bash
        run: |
          set -eu

          : > /tmp/old_all.txt
          : > /tmp/new_all.txt
          first_run=yes

          for f in $SUBSCRIPTION_TXT_FILES; do
            [ -f "$f" ] || continue
            grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' "$f" \
              >> /tmp/new_all.txt || true
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git show "HEAD:$f" \
                | grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' \
                >> /tmp/old_all.txt || true
              first_run=no
            fi
          done

          # sort each side once, after collecting every file
          LC_ALL=C sort -u /tmp/new_all.txt > /tmp/new_sorted.txt
          LC_ALL=C sort -u /tmp/old_all.txt > /tmp/old.txt

          echo "first_run=$first_run" >> "$GITHUB_OUTPUT"

          comm -13 /tmp/old.txt /tmp/new_sorted.txt > /tmp/added.txt
          comm -23 /tmp/old.txt /tmp/new_sorted.txt > /tmp/removed.txt

          added_count="$(wc -l < /tmp/added.txt | tr -d ' ')"
          removed_count="$(wc -l < /tmp/removed.txt | tr -d ' ')"

          echo "added=$added_count" >> "$GITHUB_OUTPUT"
          echo "removed=$removed_count" >> "$GITHUB_OUTPUT"
          echo "Added: $added_count"
          echo "Removed: $removed_count"

      - name: Commit and push
        if: steps.diff.outputs.added != '0' || steps.diff.outputs.removed != '0'
        shell: bash
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $SUBSCRIPTION_FILES

          if git diff --cached --quiet; then
            echo "No file changes to commit"
            exit 0
          fi

          git commit -m "🔄 auto update configs"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying..."
            sleep 10
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Publish subscription repositories
        env:
          GH_TOKEN: ${{ secrets.MULTI_REPO_TOKEN }}
        shell: bash
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::MULTI_REPO_TOKEN is not configured; generated repository shards were not published"
            exit 0
          fi
          python3 scripts/publish_repositories.py \
            /tmp/repositories \
            --owner "${{ github.repository_owner }}"

      - name: Send diff to Telegram
        if: steps.diff.outputs.first_run == 'yes' || steps.diff.outputs.added != '0' || steps.diff.outputs.removed != '0'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FIRST_RUN: ${{ steps.diff.outputs.first_run }}
          REPOSITORY_MANIFEST: /tmp/repositories/published-manifest.json
          EXTERNAL_SUBS_MANIFEST: /tmp/external_subs.json
        shell: bash
        run: |
          set -eu
          python3 scripts/notify_telegram.py